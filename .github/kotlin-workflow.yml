# What the pipeline of kheck does. Every key overrides a default of
# actions/plan/defaults.yml in davils-com/kotlin-workflow; a key that is not there stops the run.
version: 1
gradle:
  args: ["--stacktrace"]

check:
  tasks: [check]
  reproducible:
    clean-tasks:
      - ":kheck-api:clean"
      - ":kheck-core:clean"
      - ":kheck-testing:clean"
      - ":kheck-slf4j:clean"
      - ":kheck-jul:clean"
      - ":kheck-kollect:clean"
    tasks:
      - ":kheck-api:jvmJar"
      - ":kheck-core:jvmJar"
      - ":kheck-slf4j:jar"
      - ":kheck-jul:jar"
      - ":kheck-testing:jvmJar"
      - ":kheck-kollect:jvmJar"
    artifacts:
      - "kheck-api/build/libs/*.jar"
      - "kheck-core/build/libs/*.jar"
      - "kheck-slf4j/build/libs/*.jar"
      - "kheck-jul/build/libs/*.jar"
      - "kheck-testing/build/libs/*.jar"
      - "kheck-kollect/build/libs/*.jar"

policy:
  # Scheduling, timers and line breaks differ on Windows, and kheck's race and stress tests run real threads, so
  # develop, main and a tag run there too.
  push-develop:
    stages: [check, snapshot]
    os: [ubuntu-latest, windows-latest]
    overrides:
      check:
        reproducible: { enabled: true }
  push-main:
    os: [ubuntu-latest, windows-latest]
    overrides:
      check:
        reproducible: { enabled: true }
  tag:
    os: [ubuntu-latest, windows-latest]

security:
  gradle:
    tasks:
      - "kreateAssurance"
  dependency-submission:
    enabled: false

publish:
  build-tasks: [assemble]
  tasks:
    - ":kheck-api:publishAllPublicationsToDavilsRepository"
    - ":kheck-core:publishAllPublicationsToDavilsRepository"
    - ":kheck-slf4j:publishAllPublicationsToDavilsRepository"
    - ":kheck-jul:publishAllPublicationsToDavilsRepository"
    - ":kheck-testing:publishAllPublicationsToDavilsRepository"
    - ":kheck-kollect:publishAllPublicationsToDavilsRepository"
    - ":kheck-bom:publishAllPublicationsToDavilsRepository"

snapshot:
  # kheck's own build makes every build without a release tag a snapshot.
  kreate-snapshot: false

release:
  publications:
    discovery: explicit
    # In upload order: the publication of every target before the multiplatform publication that names them.
    list:
      - path: com/davils/kheck-api-jvm
        artifact: kheck-api-jvm
        task: ":kheck-api:publishJvmPublicationToDavilsRepository"
      - path: com/davils/kheck-api-wasm-js
        artifact: kheck-api-wasm-js
        task: ":kheck-api:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/kheck-api
        artifact: kheck-api
        task: ":kheck-api:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/kheck-core-jvm
        artifact: kheck-core-jvm
        task: ":kheck-core:publishJvmPublicationToDavilsRepository"
      - path: com/davils/kheck-core-wasm-js
        artifact: kheck-core-wasm-js
        task: ":kheck-core:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/kheck-core
        artifact: kheck-core
        task: ":kheck-core:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/kheck-slf4j
        artifact: kheck-slf4j
        task: ":kheck-slf4j:publishMavenPublicationToDavilsRepository"
      - path: com/davils/kheck-jul
        artifact: kheck-jul
        task: ":kheck-jul:publishMavenPublicationToDavilsRepository"
      - path: com/davils/kheck-testing-jvm
        artifact: kheck-testing-jvm
        task: ":kheck-testing:publishJvmPublicationToDavilsRepository"
      - path: com/davils/kheck-testing-wasm-js
        artifact: kheck-testing-wasm-js
        task: ":kheck-testing:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/kheck-testing
        artifact: kheck-testing
        task: ":kheck-testing:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/kheck-kollect-jvm
        artifact: kheck-kollect-jvm
        task: ":kheck-kollect:publishJvmPublicationToDavilsRepository"
      - path: com/davils/kheck-kollect-wasm-js
        artifact: kheck-kollect-wasm-js
        task: ":kheck-kollect:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/kheck-kollect
        artifact: kheck-kollect
        task: ":kheck-kollect:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/kheck-bom
        artifact: kheck-bom
        task: ":kheck-bom:publishMavenPublicationToDavilsRepository"
  attest:
    subjects:
      - "kheck-api/build/libs/*.jar"
      - "kheck-api/build/libs/*.klib"
      - "kheck-core/build/libs/*.jar"
      - "kheck-core/build/libs/*.klib"
      - "kheck-slf4j/build/libs/*.jar"
      - "kheck-jul/build/libs/*.jar"
      - "kheck-testing/build/libs/*.jar"
      - "kheck-testing/build/libs/*.klib"
      - "kheck-kollect/build/libs/*.jar"
      - "kheck-kollect/build/libs/*.klib"
  github-release:
    enabled: false

# How a pull request of Dependabot repairs itself, see CONTRIBUTING.md, "Changing a Dependency".
dependencies:
  lock:
    invocations:
      - ["kreateResolveAndLockAll", "--write-locks", "--no-configuration-cache"]
  verification:
    tasks: [check]
